[core]
# Weston 16 dropped the screen-share.so module. An output is now shared by
# running the VNC backend alongside DRM in the same compositor and pointing
# the VNC output at the native one with mirror-of, instead of the old nested
# `weston --backend=vnc-backend.so --shell=fullscreen-shell.so` child process.
backends=drm,vnc
shell=desktop-shell.so
require-input=false
idle-time=0
renderer=gl

[shell]
background-image=none
clock-format=none
panel-position=none
locking=false
num-workspaces=1
allow_zap=false
close-animation=none
startup-animation=none
focus-animation=none

# Icelandic, because the plant is. Without this the compositor seat is xkb's
# default `us` and there is no way to type oe, edh, ae or thorn on any station
# -- not over VNC and not on a keyboard plugged into the panel.
#
# The VNC half of that is worth spelling out, because the obvious suspect is
# the wrong one. weston's VNC backend has two input paths:
#
#   vnc_handle_key_event       RFB keysyms, translated through the hardcoded
#                              `key_translation[]` table in vnc.c -- US ASCII
#                              and nothing else, and a miss is a silent drop
#                              ("Key not found: keysym %08x").
#   vnc_handle_key_code_event  the QEMU extended key event: raw evdev codes,
#                              passed straight to the seat, no table.
#
# noVNC and neatvnc both implement the QEMU pseudo-encoding (-258) and
# negotiate it, so the second path is the live one -- which is why weston's
# log carries no "Key not found" lines even though the letters never arrive.
# The evdev code says which *key* was pressed; what character it produces is
# decided entirely by this keymap. So the ASCII table is a real gap but not
# this one, and no amount of patching it would have helped.
#
# Icelandic is a QWERTY variant, so the ASCII letters stay where they were.
# The extra ones land on symbol keys: <AE11> odiaeresis, <AD11> eth,
# <AC10> ae, <AB10> thorn (/usr/share/X11/xkb/symbols/is, "basic").
#
# The accented vowels are NOT fixed by this. <AC11> is `dead_acute`, and a
# dead key needs xkb_compose_state to turn dead_acute + a into aacute. The
# flutter-elinux embedder resolves characters with a bare
# xkb_keysym_to_utf32(xkb_state_key_get_one_sym(...)) and has no compose
# state, so the dead key yields U+0000 and the vowel follows unaccented.
# That one belongs in tfc-hmi's docker/frontend/ embedder patches.
[keyboard]
keymap_layout=is

[input-method]
path=/usr/local/bin/centroidx-keyboard

[vnc]
refresh-rate=60
# No tls-cert/tls-key on purpose. RA2ne (security types 6 and 130) is the only
# thing a browser can use to verify the server, and neatvnc only offers it when
# NVNC_AUTH_REQUIRE_ENCRYPTION is unset — which weston does only when TLS is
# off. /usr/local/bin/weston therefore adds --disable-transport-layer-security
# unless a tls-cert is set here. See neatvnc/README.md.

[output]
name=vnc
resizeable=false
# mirror-of needs the literal DRM connector name, which differs per station
# (eDP-1 on one panel, HDMI-A-1 on the next), so it cannot be baked in here.
# /usr/local/bin/weston substitutes the connected connector at container
# start, or drops this line entirely when no display is attached.
mirror-of=@MIRROR_OF@
