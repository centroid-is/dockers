name: Build photos-api

on:
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  packages: write

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout photos-api repository
        uses: actions/checkout@v4
        with:
          repository: centroid-is/photos-api
          token: ${{ secrets.GH_PAT }}
          path: photos-api
          ref: main

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: photos-api
          push: true
          #ghcr.io/${{ github.repository_owner }}/photos-api:${{ steps.go_version.outputs.version }},ghcr.io/${{ github.repository_owner }}/photos-api:latest
          tags: |
            ghcr.io/${{ github.repository_owner }}/photos-api:latest
